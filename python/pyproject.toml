[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    # Pinned to the same minor as the ruff-pre-commit rev in
    # .pre-commit-config.yaml. When they drifted apart, `uv run ruff check`
    # passed while the pre-commit hook reordered imports in files nobody had
    # touched - bump both together.
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]

[tool.ruff]
line-length = 120
# menu_settings.py is intentionally one data literal per line (one MenuSetting
# per menu, mirroring the source JSON 1:1 for easy diffing/verification) -
# some of those lines run past 500 characters; ruff-format would explode each
# into a multi-line call, which defeats the point. Excluded from lint/format.
extend-exclude = ["**/menu_settings.py"]

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind `except Exception` - used deliberately for best-effort cleanup/parsing
    "S112",     # try-except-continue without logging - same best-effort parsing spots
    "PYI034",   # __aenter__ -> Self - would need typing.Self (py3.11+), project supports 3.10
    "ASYNC230", # blocking open() in an async def - fine for a one-shot CLI command, not a server
]
