[project]
name = "hoermoles-ble-homeassistant"
version = "0.1.0"
description = "Home Assistant custom component for Hoermann BlueSecur (placeholder, not implemented yet)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hoermoles-ble[bleak]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoermoles_ble_homeassistant"]

[tool.uv.sources]
hoermoles-ble = { workspace = true }
